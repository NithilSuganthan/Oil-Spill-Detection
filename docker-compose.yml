# Local development infrastructure only (not production deployment).
services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: sagar
      POSTGRES_PASSWORD: sagar
      POSTGRES_DB: sagarwatch
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
      # apply schema automatically on first start
      - ./backend/app/db/migrations/001_init_postgis.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sagar -d sagarwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgis-data:
