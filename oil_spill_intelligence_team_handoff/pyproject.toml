[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oil-spill-intelligence"
version = "0.1.0"
description = "Human-in-the-loop SAR oil-slick detection, ensemble hindcasting, and AIS vessel attribution."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
ml = ["torch>=2.2", "rasterio>=1.3", "scikit-learn>=1.4"]
ocean = ["xarray>=2024.1"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
